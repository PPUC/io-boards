[platformio]
default_envs = IO_16_8_1

; One environment per board type.
;
; The environment name IS the board type name: it has to match
; ppuc::v2::BoardTypeName(), because that is how the host pairs a firmware
; image on disk with the board that reported its type over the bus. The CI
; artefact is named <env>-<version>.uf2 for the same reason.
;
; PPUC_BOARD_TYPE must be the matching ppuc::v2::BoardType value. main.cpp
; static_asserts that it is a type the protocol knows, and IOBoardController
; static_asserts that PPUCBoardTypes.h has a profile for it, so a new
; environment cannot ship reporting a value nothing can match. Neither catches
; a *forgotten* flag - see the CI check that compares the two.

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi
framework = arduino
board = pico
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
lib_deps =
    mkalkbrenner/WavePWM
    https://github.com/PPUC/Adafruit_NeoPixel#b1dc07a3dd6d019afd0a15bb59f20abc41e6225a
    https://github.com/PPUC/WS2812FX#1ab50cabb02fc0705c86c21ee9fbde7922835ffa
    Bounce2
    RPI_PICO_TimerInterrupt

[env:IO_16_8_1]
extends = common
build_flags =
    -D PICO_STDIO_USB ; enable stdio over USB
    -D PPUC_BOARD_TYPE=1

[env:IO_16x8_matrix]
extends = common
build_flags =
    -D PICO_STDIO_USB
    -D PPUC_BOARD_TYPE=2

[env:Out_8x10]
extends = common
build_flags =
    -D PICO_STDIO_USB
    -D PPUC_BOARD_TYPE=3

[env:Opto_16]
extends = common
build_flags =
    -D PICO_STDIO_USB
    -D PPUC_BOARD_TYPE=4

; Host-side unit tests. Compiles the device logic under test against the
; shims in test/stubs/ so it runs on a laptop and in CI without an RP2040.
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -I test/stubs
    -I test/conformance
    -I src
build_src_filter =
    -<*>
    +<IODevices/PwmDevices.cpp>
    +<../test/stubs/HardwareStubs.cpp>
    +<../test/conformance/ProtocolConformance.cpp>
