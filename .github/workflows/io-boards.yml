name: PPUC IO Boards

on:
    push:
    pull_request:
    schedule:
        - cron: '0 9 * * *' # run at 08:00 UTC

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION_MAJOR=$(grep -Eo "FIRMWARE_VERSION_MAJOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          VERSION_MINOR=$(grep -Eo "FIRMWARE_VERSION_MINOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          VERSION_PATCH=$(grep -Eo "FIRMWARE_VERSION_PATCH\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          TAG="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Check git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_TAG="v${{ steps.version.outputs.tag }}"
          if [[ "${GIT_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Error: Git tag (${GIT_TAG}) does not match version from PPUC.h (v${{ steps.version.outputs.tag }})"
            exit 1
          fi

  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          # platformio.ini decides which platforms and toolchains get
          # downloaded, so it is what should invalidate this cache. The key
          # used to hash '**/lockfiles', which matches no file in this repo -
          # hashFiles then returns an empty string, leaving a constant key that
          # is written once and never refreshed again.
          key: ${{ runner.os }}-platformio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-native-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Check board types against PlatformIO environments
        # The firmware's static_asserts catch a wrong PPUC_BOARD_TYPE but not a
        # forgotten one, and cannot see the environment name at all. Both
        # matter: the name pairs an image to a board, the value is what the
        # board reports.
        run: python3 tools/check-board-types.py

      - name: Run host-side unit tests
        run: pio test -e native

  pio-run:
    name: Build and upload firmware
    runs-on: ubuntu-latest
    needs: [ version ]

    strategy:
      fail-fast: false
      matrix:
          # One per PlatformIO environment, which is one per board type. The
          # names must match ppuc::v2::BoardTypeName() - the artefact name is
          # how a host pairs an image with the board that reported its type.
          controller: ['IO_16_8_1', 'IO_16x8_matrix', 'Out_8x10', 'Opto_16']

    steps:
      - name: PPUC ${{ matrix.controller }}
        uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          # See the note in the test job: the previous key hashed a glob that
          # matches nothing, so it never changed. platformio.ini is what
          # actually determines the toolchains this job downloads.
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build elf2uf2 from source
        run: |
          sudo apt update && sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
          git clone https://github.com/ckormanyos/elf2uf2.git
          cd elf2uf2
          make all
          sudo cp bin/elf2uf2 /usr/local/bin/
          cd ..

      - name: Run PlatformIO
        # The build id is this commit, truncated to 32 bits. It is what lets a
        # host tell two images apart when both call themselves the same
        # version, which is every pair of snapshots between releases.
        run: |
          BUILD_ID=0x$(git rev-parse HEAD | cut -c1-8)
          echo "build id ${BUILD_ID}"
          PLATFORMIO_BUILD_FLAGS="-DPPUC_BUILD_ID=${BUILD_ID}UL" pio run -e ${{ matrix.controller }}

      - name: Create UF2 file (using elf2uf2)
        run: |
          ELF_FILE=$(find .pio/build/${{ matrix.controller }} -name "*.elf" | head -n 1)
          echo "Found ELF file: $ELF_FILE"
          elf2uf2 "$ELF_FILE" "${ELF_FILE%.elf}.uf2"
          # A tagged build is a release and is named by version alone, which
          # keeps the plain "newer version wins" rule for released firmware.
          # Anything else is a snapshot: two snapshots share a version, so the
          # build id goes in the name or the host cannot tell them apart.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${{ matrix.controller }}-${{ needs.version.outputs.tag }}.uf2"
          else
            NAME="${{ matrix.controller }}-${{ needs.version.outputs.tag }}+$(git rev-parse HEAD | cut -c1-8).uf2"
          fi
          echo "artefact ${NAME}"
          cp ${ELF_FILE%.elf}.uf2 "${NAME}"
          echo "UF2_NAME=${NAME}" >> $GITHUB_ENV
      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.controller }}-firmware
          path: |
            ${{ env.UF2_NAME }}

  post-build:
    runs-on: ubuntu-latest
    needs: [ version, pio-run ]
    name: Release
    steps:
      - uses: actions/download-artifact@v8
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            */*.uf2
